name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      # Включает порог качества на синтетическом корпусе (tests/test_benchmark.py).
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shirma .
      - run: |
          docker run -d -p 8000:8000 --name shirma shirma
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          curl -sf localhost:8000/v1/chat/completions -H 'content-type: application/json' \
            -d '{"model":"mock","messages":[{"role":"user","content":"Позвоните Петру Иванову"}]}'
